<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceX CEO Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .options {
      margin: 20px 0;
    }
    .options button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #fff;
    }
    .options button:hover {
      background-color: #0056b3;
    }
    .timer {
      font-size: 20px;
      color: #d9534f;
    }
    .know-more {
      margin-top: 20px;
    }
    .know-more button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: #fff;
    }
    .know-more button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>Who is the CEO of SpaceX?</h1>
    <div class="options">
      <button onclick="checkAnswer('Elon Musk')">Elon Musk</button>
      <button onclick="checkAnswer('Jeff Bezos')">Jeff Bezos</button>
      <button onclick="checkAnswer('Bill Gates')">Bill Gates</button>
      <button onclick="checkAnswer('Tim Cook')">Tim Cook</button>
    </div>
    <div class="timer">Time left: <span id="time">10</span> seconds</div>
    <div class="know-more">
      <button onclick="window.open('https://ryancartz.github.io/co-blg/', '_blank')">Know more...</button>
    </div>
  </div>

  <script>
    // Timer functionality
    let timeLeft = 10;
    const timerElement = document.getElementById('time');
    const timer = setInterval(() => {
      timeLeft--;
      timerElement.textContent = timeLeft;
      if (timeLeft === 0) {
        clearInterval(timer);
        playSound('timeup'); // Play time-up sound
        speak("Time is up! The correct answer is Elon Musk.");
        alert('Time is up! The correct answer is Elon Musk.');
      }
    }, 1000);

    // Check answer
    function checkAnswer(answer) {
      clearInterval(timer);
      if (answer === 'Elon Musk') {
        playSound('correct'); // Play correct sound
        speak("Correct! Elon Musk is the CEO of SpaceX.");
        alert('Correct! Elon Musk is the CEO of SpaceX.');
      } else {
        playSound('incorrect'); // Play incorrect sound
        speak("Incorrect! The correct answer is Elon Musk.");
        alert('Incorrect! The correct answer is Elon Musk.');
      }
    }

    // Play sound function
    function playSound(type) {
      const audio = new Audio();
      switch (type) {
        case 'correct':
          audio.src = 'https://www.soundjay.com/buttons/button-3.mp3'; // Correct sound
          break;
        case 'incorrect':
          audio.src = 'https://www.soundjay.com/buttons/button-10.mp3'; // Incorrect sound
          break;
        case 'timeup':
          audio.src = 'https://www.soundjay.com/misc/sci-fi-alarm-01.mp3'; // Time-up sound
          break;
      }
      audio.play();
    }

    // Pronounce text
    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
    }

    // Pronounce the question and options on page load
    window.onload = () => {
      const question = "The question is, who is the CEO of SpaceX? And your options are: Elon Musk, Jeff Bezos, Bill Gates, and Tim Cook. Your time starts now.";
      speak(question"The question is, who is the CEO of SpaceX? And your option are: Elon Musk, Jeff Bezos, Bill Gates and Tim Cook. : your time starts now." );
    };
  </script>
</body>
</html>
